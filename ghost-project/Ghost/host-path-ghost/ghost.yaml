apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      volumes:
        - name: ghost-data
          persistentVolumeClaim:
            claimName: ghost-pvc
      containers:
        - name: ghost
          image: m.daocloud.io/docker.io/ghost:5
          ports:
            - containerPort: 2368
          volumeMounts:
            - name: ghost-data
              mountPath: /var/lib/ghost/content
          env:
            - name: database__client
              value: mysql
            - name: database__connection__host
              value: mysql.blog.svc.cluster.local
            - name: database__connection__user
              value: ghost
            - name: database__connection__password
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: ghost-password
            - name: database__connection__database
              value: ghost
            - name: url
              value: http://2399f3aa.r28.cpolar.top #http://192.168.19.132:30080
            - name: NODE_OPTIONS
              value: --dns-result-order=ipv4first
            - name: mail__transport
              value: "SMTP"
            - name: mail__from
              value: "2153271072@qq.com"
            - name: mail__options__port
              value: "465"
            - name: mail__options__secure
              value: "true"
            - name: mail__options__auth__user
              value: "2153271072@qq.com"
            - name: mail__options__host
              value: "smtp.qq.com"
            - name: mail__options__auth__pass
              valueFrom:
                secretKeyRef:
                  name: ghost-mail-secret
                  key: smtp-password
          livenessProbe:
            httpGet:
              path: /
              port: 2368
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 2368
            initialDelaySeconds: 20
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: ghost
  namespace: blog
spec:
  selector:
    app: ghost
  type: NodePort
  ports:
    - port: 2368
      nodePort: 30080


