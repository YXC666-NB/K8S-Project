apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: m.daocloud.io/docker.io/prom/prometheus:v2.53.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: rules
          mountPath: /etc/prometheus/rules.yml
          subPath: rules.yml
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: rules
        configMap: 
          name: prometheus-rules 

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s # 数据采集间隔
      evaluation_interval: 15s  # 告警评估间隔
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager.monitoring.svc.cluster.local:9093
        path_prefix: /
        api_version: v2
        timeout: 10s
    # 告警规则文件路径
    rule_files:
    - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: 'mysql-exporter'
        static_configs:
        - targets:
          - 'mysql-exporter.blog.svc.cluster.local:9104'
      - job_name: 'probe_ghost'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
        - targets:
          - http://ghost.blog.svc.cluster.local:2368
        relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - target_label: __address__
          replacement: blackbox-exporter.monitoring.svc.cluster.local:9115

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: 9090
    nodePort: 30090
