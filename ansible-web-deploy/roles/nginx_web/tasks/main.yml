---
# 1.安装 nginx
- name: install nginx package
  dnf:
    name: "{{ nginx_package_name }}"
    state: present

# 2. 推送nginx配置模板
- name: deploy nginx conf template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/default.conf
  notify: restart nginx

# 3. 推送网站首页
- name: copy web index.html
  template:
    src: index.html
    dest: "{{ nginx_document_root }}/index.html"
    mode: '0644'
  notify:  restart nginx

# 4. 启动并设置开机自启
- name: start and enable nginx
  service:
    name: "{{ nginx_service_name }}"
    state: started
    enabled: yes

# 5. 健康检查，访问本地80端口
- name: check nginx web status
  uri:
    url: http://127.0.0.1
    status_code: 200
  register: web_result
  when: not ansible_check_mode
- debug:
    msg: " {{ inventory_hostname }} Web服务部署成功！返回状态：{{ web_result.status | default('check 模式跳过') }}"
