version: "3.8"

services:
  aiops-agent:
    build: .
    container_name: langgraph-aiops-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - ./log_config.json:/app/log_config.json:ro
      - ./ssh-keys:/app/ssh-keys:ro
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./kubeconfig:/app/.kube/config:ro
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose","--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

