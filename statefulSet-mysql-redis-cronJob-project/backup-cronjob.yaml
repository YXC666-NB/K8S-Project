apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-cron
  namespace: biz
spec:
  # cron表达式：分 时 日 月 周 → 每日02:00执行
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: backup-sa
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: mysql:5.7 # 内置mysqldump，自带redis-cli依赖可安装
            imagePullPolicy: IfNotPresent
            env:
            # MySQL连接信息
            - name: MYSQL_HOST
              value: mysql-0.mysql-svc.biz.svc.cluster.local
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: db-redis-secret
                  key: mysql-root-pwd
            # Redis连接信息
            - name: REDIS_HOST
              value: redis-0.redis-svc.biz.svc.cluster.local
            - name: REDIS_PWD
              valueFrom:
                secretKeyRef:
                  name: db-redis-secret
                  key: redis-auth
            volumeMounts:
            - name: backup-volume
              mountPath: /backup
            command:
            - /bin/sh
            - -c
            - |
              # 安装redis-cli
              apk update && apk add redis
              DATE=$(date +%Y%m%d_%H%M%S)
              BACKUP_DIR=/backup

              # 1. MySQL全库备份
              mysqldump -h $MYSQL_HOST -uroot --all-databases > $BACKUP_DIR/mysql_all_$DATE.sql

              # 2. Redis触发RDB持久化，拷贝dump.rdb
              redis-cli -h $REDIS_HOST -a $REDIS_PWD BGSAVE
              sleep 3
              # 从redis容器拷贝rdb（临时方案，简易版；生产推荐redis-cli --rdb）
              redis-cli -h $REDIS_HOST -a $REDIS_PWD --rdb $BACKUP_DIR/redis_dump_$DATE.rdb

              # 自动清理7天前备份文件
              find $BACKUP_DIR -name "*.sql" -o -name "*.rdb" -mtime +7 -delete
          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: backup-storage
