# 开发环境：资源小，每6小时备份一次
replicaCount:
  mysql: 1
  redis: 1

cronjob:
  schedule: "0 */6 * * *"
  keepBackupDays: 2

resources:
  mysql:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  redis:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
