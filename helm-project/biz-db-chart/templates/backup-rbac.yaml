apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "biz-db-chart.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-role
  namespace: {{ .Values.namespace }}
  labels:
{{ include "biz-db-chart.labels" . | indent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods","secrets"]
  verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-rolebinding
  namespace: {{ .Values.namespace }}
  labels:
{{ include "biz-db-chart.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-role
subjects:
- kind: ServiceAccount
  name: backup-sa
  namespace: {{ .Values.namespace }}
