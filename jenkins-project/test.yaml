apiVersion: v1
kind: Pod
metadata:
  name: pod-test
spec:
  serviceAccountName: jenkins-admin
  containers:
  - name: git
    image: alpine/git:latest
    command: ['cat']
    tty: true

  - name: docker
    image: docker:cli
    command: ['cat']
    tty: true
    volumeMounts:
    - mountPath: /var/run/docker.sock
      name: docker-sock
 
      
  - name: kubectl 
    image: bitnami/kubectl:latest
    command: ['cat']
    tty: true
      
  volumes:
  - name: docker-sock
    hostPath:
      path: /var/run/docker.sock
